        const MAX_GPS_ACCURACY_METERS = 50;
        const MAX_CYCLING_SPEED_METERS_PER_SECOND = 45;
        const GPS_RECOVERY_STORAGE_PREFIX = 'ride-x-unsynced-gps:';

        function gpsErrorMessage(error) {
            if (error.code === 1) return 'A permissão de localização foi negada. Libere o acesso à localização nas configurações do navegador.';
            if (error.code === 2) return 'O dispositivo não conseguiu obter uma posição. Verifique o GPS e tente novamente.';
            if (error.code === 3) return 'A localização demorou para responder. O rastreamento continua tentando obter sinal.';
            return error.message || 'Erro desconhecido ao acessar a localização.';
        }

        function ensureGeolocationAvailable() {
            if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                throw new Error('A localização exige uma conexão segura (HTTPS) ou localhost.');
            }
            if (!navigator.geolocation) {
                throw new Error('Este navegador não oferece suporte à geolocalização.');
            }
        }

        function getCurrentPosition() {
            ensureGeolocationAvailable();
            return new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, error => reject(new Error(gpsErrorMessage(error))), {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 30000
                });
            });
        }

        function haversineMeters(first, second) {
            const toRadians = degrees => degrees * Math.PI / 180;
            const latitudeDifference = toRadians(second.latitude - first.latitude);
            const longitudeDifference = toRadians(second.longitude - first.longitude);
            const latitudeOne = toRadians(first.latitude);
            const latitudeTwo = toRadians(second.latitude);
            const haversine = Math.sin(latitudeDifference / 2) ** 2
                + Math.cos(latitudeOne) * Math.cos(latitudeTwo) * Math.sin(longitudeDifference / 2) ** 2;
            return 6371008.8 * 2 * Math.atan2(Math.sqrt(haversine), Math.sqrt(1 - haversine));
        }

        function calculateTrackDistanceMeters(points) {
            let distance = 0;
            for (let index = 1; index < points.length; index += 1) {
                if (!points[index].segment_start) distance += haversineMeters(points[index - 1], points[index]);
            }
            return distance;
        }

        function calculateTrackSummary(points) {
            const distance = calculateTrackDistanceMeters(points);
            let elevationGain = 0;
            for (let index = 1; index < points.length; index += 1) {
                const previous = points[index - 1];
                const current = points[index];
                if (!current.segment_start && Number.isFinite(previous.altitude_m) && Number.isFinite(current.altitude_m)) {
                    elevationGain += Math.max(0, current.altitude_m - previous.altitude_m);
                }
            }
            return {
                distance_km: Number((distance / 1000).toFixed(2)),
                elevation_m: Math.min(30000, Math.round(elevationGain))
            };
        }

        function getVisibleGpsPoints() {
            const points = new Map();
            [...state.gpsPoints, ...state.pendingGpsPoints].forEach(point => points.set(point.sequence, point));
            return [...points.values()].sort((first, second) => first.sequence - second.sequence);
        }

        function convertGpsPosition(position, segmentStart = false) {
            const { latitude, longitude, accuracy, altitude } = position.coords;
            state.gpsAccuracyMeters = Number.isFinite(accuracy) ? accuracy : null;
            const timestamp = Number(position.timestamp);
            if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90
                || !Number.isFinite(longitude) || longitude < -180 || longitude > 180) {
                return { error: 'Coordenadas GPS inválidas foram descartadas.' };
            }
            if (!Number.isFinite(accuracy) || accuracy <= 0 || accuracy > MAX_GPS_ACCURACY_METERS) {
                return { error: `Precisão GPS insuficiente (limite: ${MAX_GPS_ACCURACY_METERS} m); aguardando sinal melhor.` };
            }
            if (!Number.isFinite(timestamp) || timestamp <= 0 || Math.abs(Date.now() - timestamp) > 120000) {
                return { error: 'Uma posição GPS antiga foi descartada; aguardando uma leitura atual.' };
            }
            const point = {
                latitude,
                longitude,
                accuracy_m: accuracy,
                altitude_m: Number.isFinite(altitude) ? altitude : null,
                recorded_at: new Date(timestamp).toISOString(),
                segment_start: segmentStart,
                source: 'gps'
            };
            return validateTrackPoint(point, [...state.gpsPoints, ...state.pendingGpsPoints], true);
        }

        function validateTrackPoint(point, priorPoints, checkSpeed) {
            if (!Number.isFinite(point.latitude) || point.latitude < -90 || point.latitude > 90
                || !Number.isFinite(point.longitude) || point.longitude < -180 || point.longitude > 180
                || (point.accuracy_m !== null && point.accuracy_m !== undefined
                    && (!Number.isFinite(point.accuracy_m) || point.accuracy_m < 0 || point.accuracy_m > MAX_GPS_ACCURACY_METERS))
                || (point.altitude_m !== null && point.altitude_m !== undefined
                    && (!Number.isFinite(point.altitude_m) || point.altitude_m < -12000 || point.altitude_m > 100000))) {
                return { error: 'Um ponto GPS inválido foi descartado.' };
            }
            const previous = priorPoints[priorPoints.length - 1];
            if (previous) {
                const distance = haversineMeters(previous, point);
                const accuracies = [previous.accuracy_m, point.accuracy_m].filter(Number.isFinite);
                const noiseThreshold = Math.max(2, Math.min(10, accuracies.length
                    ? accuracies.reduce((sum, value) => sum + value, 0) / accuracies.length * 0.5
                    : 2));
                if (distance < noiseThreshold && !point.segment_start) return { error: null, skip: true };
                if (checkSpeed && !point.segment_start && previous.recorded_at && point.recorded_at) {
                    const elapsed = (Date.parse(point.recorded_at) - Date.parse(previous.recorded_at)) / 1000;
                    if (!Number.isFinite(elapsed) || elapsed <= 0) return { error: 'Uma posição GPS fora de ordem foi descartada.' };
                    if (distance / elapsed > MAX_CYCLING_SPEED_METERS_PER_SECOND) {
                        return { error: 'Um salto GPS incompatível com a velocidade de pedalada foi descartado.' };
                    }
                }
            }
            return { point };
        }

        function activityPointsStorageKey() {
            return `${GPS_RECOVERY_STORAGE_PREFIX}${state.authUser.id}`;
        }

        function loadPendingGpsPoints(activityId) {
            try {
                const saved = JSON.parse(localStorage.getItem(activityPointsStorageKey()) || 'null');
                return saved?.activityId === activityId && Array.isArray(saved.points) ? saved.points : [];
            } catch (error) {
                console.error('Falha ao recuperar pontos GPS locais:', error);
                showToast('Não foi possível recuperar os pontos GPS ainda não sincronizados deste dispositivo.', 'info');
                return [];
            }
        }

        function persistPendingGpsPoints() {
            if (state.activeActivity?.local_only) return;
            try {
                if (!state.pendingGpsPoints.length || !state.activeActivity) {
                    localStorage.removeItem(activityPointsStorageKey());
                    return;
                }
                localStorage.setItem(activityPointsStorageKey(), JSON.stringify({
                    activityId: state.activeActivity.id,
                    points: state.pendingGpsPoints
                }));
            } catch (error) {
                console.error('Falha ao salvar recuperação local de GPS:', error);
                showToast('O navegador não permitiu salvar a cópia local de recuperação GPS.', 'info');
            }
        }

        async function fetchActivityPoints(activityId) {
            const localActivity = state.activities.find(activity => activity.id === activityId && activity.local_only);
            if (localActivity) return localActivity.points || [];
            const allPoints = [];
            const pageSize = 1000;
            for (let offset = 0; ; offset += pageSize) {
                const { data, error } = await window.rideXSupabase
                    .from('activity_points')
                    .select('sequence,latitude,longitude,accuracy_m,altitude_m,recorded_at,segment_start,source')
                    .eq('activity_id', activityId)
                    .order('sequence', { ascending: true })
                    .range(offset, offset + pageSize - 1);
                if (error) throw error;
                allPoints.push(...data);
                if (data.length < pageSize) break;
            }
            return allPoints;
        }

        async function persistTrackPoint(point) {
            if (!state.activeActivity) throw new Error('Nenhuma atividade está ativa para receber pontos GPS.');
            const valid = validateTrackPoint(point, [...state.gpsPoints, ...state.pendingGpsPoints], point.source === 'gps');
            if (valid.error) {
                if (!valid.skip) {
                    state.gpsSignalLost = true;
                    updateTrackingStatus(valid.error);
                }
                return;
            }
            if (valid.skip) return;

            const sequence = Math.max(
                state.gpsPoints.length,
                ...state.pendingGpsPoints.map(pending => pending.sequence + 1)
            );
            const pending = { ...valid.point, sequence };
            state.pendingGpsPoints.push(pending);
            persistPendingGpsPoints();
            updateTrackDisplay();
            if (state.activeActivity.local_only) {
                state.pendingGpsPoints = [];
                state.gpsPoints.push(pending);
                const summary = calculateTrackSummary(state.gpsPoints);
                state.activeActivity = { ...state.activeActivity, ...summary };
                persistLocalActivity();
                state.gpsSignalLost = false;
                updateTrackingStatus('GPS conectado · percurso salvo neste dispositivo');
                updateTrackDisplay();
                return;
            }
            const { error } = await window.rideXSupabase.from('activity_points').upsert({
                ...pending,
                activity_id: state.activeActivity.id,
                user_id: state.authUser.id
            }, { onConflict: 'activity_id,sequence', ignoreDuplicates: true });
            if (error) throw error;

            state.pendingGpsPoints = state.pendingGpsPoints.filter(item => item.sequence !== sequence);
            state.gpsPoints.push(pending);
            persistPendingGpsPoints();
            const summary = calculateTrackSummary(state.gpsPoints);
            const { data: updatedActivity, error: activityError } = await window.rideXSupabase.from('activities')
                .update(summary).eq('id', state.activeActivity.id).select('id').maybeSingle();
            if (activityError) throw activityError;
            if (!updatedActivity) throw new Error('Pedalada não encontrada ou não autorizada.');
            state.activeActivity = { ...state.activeActivity, ...summary };
            state.gpsSignalLost = false;
            updateTrackingStatus('GPS conectado · posição registrada');
            updateTrackDisplay();
        }

        async function flushPendingGpsPoints() {
            for (const point of [...state.pendingGpsPoints]) {
                const { error } = await window.rideXSupabase.from('activity_points').upsert({
                    ...point,
                    activity_id: state.activeActivity.id,
                    user_id: state.authUser.id
                }, { onConflict: 'activity_id,sequence', ignoreDuplicates: true });
                if (error) throw error;
                if (!state.gpsPoints.some(saved => saved.sequence === point.sequence)) state.gpsPoints.push(point);
                state.pendingGpsPoints = state.pendingGpsPoints.filter(item => item.sequence !== point.sequence);
                persistPendingGpsPoints();
            }
            if (state.pendingGpsPoints.length === 0) {
                const summary = calculateTrackSummary(state.gpsPoints);
                const { data, error } = await window.rideXSupabase.from('activities').update(summary)
                    .eq('id', state.activeActivity.id).select('id').maybeSingle();
                if (error) throw error;
                if (!data) throw new Error('Pedalada não encontrada ou não autorizada.');
                state.activeActivity = { ...state.activeActivity, ...summary };
            }
        }

        function updateTrackingStatus(message) {
            const status = document.getElementById('tracking-status');
            if (status) status.textContent = message;
            const stateLabel = document.getElementById('tracking-state-label');
            if (stateLabel && state.activeActivity) {
                stateLabel.textContent = state.activeActivity.status === 'paused'
                    ? 'Pausada'
                    : state.gpsSignalLost ? 'Buscando GPS' : 'Gravando';
            }
        }

        function updateTrackDisplay(points = getVisibleGpsPoints(), activityId = state.activeActivity?.id) {
            if (activityMapActivityId && activityId !== activityMapActivityId) return;
            const distance = document.getElementById('tracking-distance');
            const elevation = document.getElementById('tracking-elevation');
            const pointCount = document.getElementById('tracking-point-count');
            const summary = calculateTrackSummary(points);
            if (distance) distance.textContent = `${summary.distance_km.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} km`;
            if (elevation) elevation.textContent = `${summary.elevation_m.toLocaleString('pt-BR')} m`;
            if (pointCount) pointCount.textContent = String(points.length);
            if (!activityMap || !window.L) return;
            if (activityMapActivityId && activityId !== activityMapActivityId) return;
            const segments = [];
            for (const point of points) {
                if (!segments.length || point.segment_start) segments.push([]);
                segments[segments.length - 1].push([point.latitude, point.longitude]);
            }
            if (activityTrackLine) activityTrackLine.remove();
            activityTrackLine = L.featureGroup(segments.filter(segment => segment.length > 1)
                .map(segment => L.polyline(segment, { color: '#B7F34A', weight: 5, opacity: 0.9 }))).addTo(activityMap);
            const latLngs = points.map(point => [point.latitude, point.longitude]);
            if (latLngs.length) {
                if (activityPositionMarker) activityPositionMarker.setLatLng(latLngs[latLngs.length - 1]);
                else activityPositionMarker = L.circleMarker(latLngs[latLngs.length - 1], {
                    radius: 7, color: '#0B0D0F', weight: 2, fillColor: '#B7F34A', fillOpacity: 1
                }).addTo(activityMap);
                activityMap.setView(latLngs[latLngs.length - 1], Math.max(activityMap.getZoom(), 15));
            }
        }

        function initializeActivityMap(points, activityId) {
            const mapElement = document.getElementById('tracking-metrics-map');
            if (!mapElement) return;
            if (!window.L) {
                mapElement.textContent = 'Não foi possível carregar o mapa. Verifique sua conexão.';
                return;
            }
            if (!points.length) {
                mapElement.innerHTML = '<p class="p-6 text-sm text-slate-300">Aguardando um ponto GPS válido. Nenhuma localização foi inventada.</p>';
                return;
            }
            const last = points[points.length - 1];
            activityMap = L.map(mapElement).setView([last.latitude, last.longitude], 15);
            activityMapActivityId = activityId;
            addRideXMapTiles(activityMap);
            updateTrackDisplay(points, activityId);
            if (activityTrackLine.getLayers().length) activityMap.fitBounds(activityTrackLine.getBounds(), { padding: [24, 24] });
        }

        function formatElapsedTime(activity) {
            const started = Date.parse(activity.started_at);
            if (!Number.isFinite(started)) return '00:00:00';
            const seconds = getElapsedSeconds(activity);
            const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const minutes = String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
            return `${hours}:${minutes}:${String(seconds % 60).padStart(2, '0')}`;
        }

        function getElapsedSeconds(activity) {
            const started = Date.parse(activity.started_at);
            if (!Number.isFinite(started)) return 0;
            const ended = activity.ended_at ? Date.parse(activity.ended_at) : Date.now();
            let seconds = Math.max(0, Math.floor((ended - started) / 1000) - Number(activity.paused_seconds || 0));
            if (activity.status === 'paused' && activity.paused_at) {
                seconds -= Math.max(0, Math.floor((Date.now() - Date.parse(activity.paused_at)) / 1000));
            }
            return Math.max(0, seconds);
        }

        function getFinalPausedSeconds(activity, endedAt) {
            const previousPausedSeconds = Number(activity.paused_seconds || 0);
            if (activity.status !== 'paused' || !activity.paused_at) return previousPausedSeconds;
            return previousPausedSeconds + Math.max(0, Math.floor((Date.parse(endedAt) - Date.parse(activity.paused_at)) / 1000));
        }

        function formatSpeedKmh(speedMps) {
            return `${(Math.max(0, speedMps) * 3.6).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km/h`;
        }

        function updateElapsedTime(activity = state.activeActivity, points = getVisibleGpsPoints()) {
            const target = document.getElementById('tracking-elapsed');
            if (!activity) return;
            if (target) target.textContent = formatElapsedTime(activity);
            if (state.gpsLastPositionAt && Date.now() - state.gpsLastPositionAt > 15000) {
                state.gpsCurrentSpeedMps = 0;
                state.gpsSpeedSamples = [];
            }
            const currentSpeed = document.getElementById('tracking-speed');
            if (currentSpeed) currentSpeed.textContent = activity.status === 'completed'
                ? '—'
                : formatSpeedKmh(state.gpsCurrentSpeedMps).replace(' km/h', '');
            const averageSpeed = document.getElementById('tracking-average-speed');
            if (averageSpeed) {
                const elapsedSeconds = getElapsedSeconds(activity);
                const distanceMeters = calculateTrackDistanceMeters(points);
                averageSpeed.textContent = formatSpeedKmh(elapsedSeconds > 0 ? distanceMeters / elapsedSeconds : 0);
            }
            const accuracy = document.getElementById('tracking-accuracy');
            if (accuracy) {
                const lastPointAccuracy = points.at(-1)?.accuracy_m;
                const accuracyMeters = Number.isFinite(lastPointAccuracy)
                    ? lastPointAccuracy
                    : activity.status === 'in_progress' ? state.gpsAccuracyMeters : null;
                accuracy.textContent = accuracyMeters === null
                    ? 'Precisão GPS: aguardando leitura'
                    : `Precisão reportada pelo aparelho: ±${Math.round(accuracyMeters)} m`;
            }
        }

        function openTrackingModal(readOnly = false, viewedActivity = state.activeActivity, viewedPoints = getVisibleGpsPoints()) {
            if (!viewedActivity && !readOnly) return;
            const activity = viewedActivity;
            const points = viewedPoints;
            openModal(readOnly ? 'Mapa da pedalada' : 'Gravando pedalada', `
                <div class="tracking-screen">
                    <section class="tracking-hero">
                        <div class="min-w-0">
                            <p class="text-[10px] font-extrabold uppercase tracking-[0.22em] text-lime/80">Velocidade atual</p>
                            <strong id="tracking-speed" class="tracking-speed-value mt-2">${formatSpeedKmh(state.gpsCurrentSpeedMps).replace(' km/h', '')}</strong>
                            <span class="mt-1 block text-sm font-semibold text-slate-400">km/h</span>
                        </div>
                        <div class="min-w-[96px] text-right">
                            <span class="inline-flex items-center gap-2 rounded-full border border-lime/20 bg-lime/10 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-lime">
                                <span class="relative flex h-2 w-2"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-lime opacity-60"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-lime"></span></span>
                                <span id="tracking-state-label">${activity.status === 'paused' ? 'Pausada' : activity.status === 'completed' ? 'Finalizada' : 'Gravando'}</span>
                            </span>
                            <span id="tracking-elapsed" class="mt-3 block font-mono text-xl font-bold tabular-nums text-white">${activity ? formatElapsedTime(activity) : '00:00:00'}</span>
                            <span class="mt-0.5 block text-[10px] font-semibold uppercase tracking-wider text-slate-500">Tempo de pedal</span>
                        </div>
                    </section>
                    <section class="grid grid-cols-3 gap-2.5" aria-label="Métricas da pedalada">
                        <div class="tracking-stat-card">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-500">Distância</span>
                            <strong id="tracking-distance" class="mt-1 block truncate text-xl font-extrabold tabular-nums text-white">0,00 km</strong>
                        </div>
                        <div class="tracking-stat-card">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-500">Média</span>
                            <strong id="tracking-average-speed" class="mt-1 block truncate text-xl font-extrabold tabular-nums text-white">0,0 km/h</strong>
                        </div>
                        <div class="tracking-stat-card">
                            <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-500">Elevação*</span>
                            <strong id="tracking-elevation" class="mt-1 block truncate text-xl font-extrabold tabular-nums text-white">0 m</strong>
                        </div>
                    </section>
                    <section class="tracking-map-shell">
                        <div class="tracking-map-heading">
                            <div class="min-w-0">
                                <p class="text-[10px] font-extrabold uppercase tracking-[0.16em] text-slate-300">Seu percurso</p>
                                <p id="tracking-route-name" class="mt-0.5 truncate text-xs text-slate-500">${escapeHTML(activity?.name || 'Pedalada')}</p>
                            </div>
                            <span class="shrink-0 rounded-full bg-grafite-700 px-2.5 py-1 text-[10px] font-semibold text-slate-300"><i class="fa-solid fa-location-dot mr-1 text-lime"></i><span id="tracking-point-count">${points.length}</span> pontos</span>
                        </div>
                        <div id="tracking-metrics-map" role="application" aria-label="Mapa do percurso GPS em tempo real"></div>
                    </section>
                    <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 px-1">
                        <p id="tracking-status" class="min-w-0 flex-1 text-[11px] font-medium text-slate-400">${readOnly ? 'Percurso registrado' : 'Verificando sinal GPS…'}</p>
                        <p id="tracking-accuracy" class="text-[10px] text-slate-500">Precisão aguardando</p>
                    </div>
                    <p class="px-1 text-[10px] leading-relaxed text-slate-500">Precisão informada pelo aparelho (não garantida). *Elevação apenas quando fornecida pelo GPS. Mantenha esta tela aberta; o navegador pode suspender o GPS em segundo plano.</p>
                    ${activity.local_only ? '<p class="rounded-lg border border-sky-400/15 bg-sky-400/5 px-3 py-2 text-[10px] text-sky-200/80"><i class="fa-solid fa-mobile-screen-button mr-1.5"></i>Modo de teste: salva somente neste aparelho.</p>' : ''}
                    ${readOnly ? '' : `<div class="tracking-screen-actions">
                        ${activity.status === 'in_progress' && state.gpsWatchId !== null ? `<button onclick="pauseActivity()" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-grafite-700 px-5 py-3 text-sm font-bold text-white transition-colors hover:bg-grafite-600"><i class="fa-solid fa-pause"></i>Pausar</button>` : ''}
                        ${(activity.status === 'paused' || state.gpsWatchId === null) && !readOnly ? `<button onclick="resumeActivity()" class="inline-flex items-center gap-2 rounded-xl bg-lime px-5 py-3 text-sm font-extrabold text-grafite-900 transition-colors hover:bg-lime-hover"><i class="fa-solid fa-play"></i>Retomar pedal</button>` : ''}
                        <button onclick="finishActivity()" class="inline-flex items-center gap-2 rounded-xl bg-red-500 px-5 py-3 text-sm font-extrabold text-white transition-colors hover:bg-red-400"><i class="fa-solid fa-flag-checkered"></i>Finalizar</button>
                    </div>`}
                </div>
            `);
            const modal = document.getElementById('global-modal');
            const modalPanel = modal.querySelector('.glass-panel');
            modal.classList.add('tracking-modal-open');
            modalPanel.classList.add('tracking-screen-panel');
            modalPanel.firstElementChild.classList.add('tracking-screen-header');
            document.getElementById('modal-body').classList.add('tracking-screen-body');
            modalPanel.classList.replace('max-w-lg', 'max-w-5xl');
            document.getElementById('modal-footer').classList.add('hidden');
            activityMapActivityId = activity.id;
            updateTrackDisplay(points, activity.id);
            initializeActivityMap(points, activity.id);
            if (activityMap) requestAnimationFrame(() => activityMap?.invalidateSize());
            updateElapsedTime(activity, points);
            const pointCount = document.getElementById('tracking-point-count');
            if (pointCount) pointCount.textContent = String(points.length);
            if (!readOnly) {
                updateTrackingStatus(activity.status === 'paused'
                    ? 'Pedalada pausada · o GPS está desligado'
                    : state.gpsWatchId === null && state.activeActivity?.id === activity.id
                        ? 'Pedalada recuperada · toque em Retomar para reativar o GPS'
                        : state.gpsSignalLost && state.activeActivity?.id === activity.id ? 'Sinal GPS perdido · tentando reconectar'
                            : points.length ? `GPS conectado · ${points.length} posições válidas`
                                : 'GPS conectado · aguardando a primeira posição válida');
                state.trackingTimer = setInterval(updateElapsedTime, 1000);
            }
        }

        async function showActivityTrack(activityId) {
            try {
                const activity = state.activities.find(item => item.id === activityId);
                if (!activity) throw new Error('Atividade não encontrada.');
                const points = await fetchActivityPoints(activityId);
                openTrackingModal(true, activity, points);
            } catch (error) {
                console.error('Falha ao carregar percurso GPS:', error);
                showToast(error.message || 'Não foi possível carregar o percurso.', 'info');
            }
        }

        async function openActiveTracking() {
            if (!state.activeActivity) return;
            if (state.activeActivity.status === 'paused' || state.gpsWatchId === null) {
                await resumeActivity();
                return;
            }
            openTrackingModal();
        }

        async function handleActivityButton() {
            if (state.activeActivity) {
                await openActiveTracking();
                return;
            }
            await startActivity();
        }

        async function requestScreenWakeLock() {
            if (!navigator.wakeLock?.request || state.screenWakeLock || document.visibilityState !== 'visible') return;
            try {
                state.screenWakeLock = await navigator.wakeLock.request('screen');
                state.screenWakeLock.addEventListener('release', () => {
                    state.screenWakeLock = null;
                }, { once: true });
            } catch (error) {
                console.warn('Não foi possível manter a tela ativa durante a pedalada:', error);
                showToast('Mantenha a tela ativa para reduzir o risco de interrupção do GPS.', 'info');
            }
        }

        async function releaseScreenWakeLock() {
            if (!state.screenWakeLock) return;
            const wakeLock = state.screenWakeLock;
            state.screenWakeLock = null;
            try {
                await wakeLock.release();
            } catch (error) {
                console.warn('Não foi possível liberar o bloqueio de tela:', error);
            }
        }

        function startPositionWatch() {
            ensureGeolocationAvailable();
            stopPositionWatch();
            state.gpsSignalLost = false;
            state.gpsWatchId = navigator.geolocation.watchPosition(position => {
                state.gpsSaveQueue = state.gpsSaveQueue.then(async () => {
                    const converted = convertGpsPosition(position);
                    if (converted.error) {
                        state.gpsSignalLost = true;
                        state.gpsCurrentSpeedMps = 0;
                        updateTrackingStatus(converted.error);
                        updateElapsedTime();
                        return;
                    }
                    if (converted.point) {
                        const previous = getVisibleGpsPoints().at(-1);
                        const elapsed = previous?.recorded_at
                            ? (Date.parse(converted.point.recorded_at) - Date.parse(previous.recorded_at)) / 1000
                            : 0;
                        const calculatedSpeed = previous && elapsed > 0 && !converted.point.segment_start
                            ? haversineMeters(previous, converted.point) / elapsed
                            : 0;
                        const deviceSpeed = position.coords.speed;
                        const speed = converted.point.accuracy_m <= 25
                            && Number.isFinite(deviceSpeed) && deviceSpeed >= 0
                            ? deviceSpeed
                            : calculatedSpeed;
                        const validSpeed = Number.isFinite(speed) && speed <= MAX_CYCLING_SPEED_METERS_PER_SECOND
                            ? speed
                            : 0;
                        state.gpsSpeedSamples = [...state.gpsSpeedSamples, validSpeed].slice(-3);
                        state.gpsCurrentSpeedMps = state.gpsSpeedSamples.reduce((sum, sample) => sum + sample, 0)
                            / state.gpsSpeedSamples.length;
                        state.gpsAccuracyMeters = converted.point.accuracy_m;
                        state.gpsLastPositionAt = Date.now();
                        await persistTrackPoint(converted.point);
                        updateElapsedTime();
                    }
                }).catch(error => {
                    console.error('Falha ao persistir ponto GPS:', error);
                    state.gpsSignalLost = true;
                    state.gpsCurrentSpeedMps = 0;
                    state.gpsSpeedSamples = [];
                    updateElapsedTime();
                    updateTrackingStatus(state.activeActivity?.local_only
                        ? 'Falha ao salvar localmente · confira o armazenamento do navegador'
                        : 'Sem sincronização · há pontos pendentes; reconecte para tentar sincronizar');
                    showToast(error.message || 'Falha ao sincronizar um ponto GPS.', 'info');
                });
            }, error => {
                const notify = !state.gpsSignalLost || error.code === 1;
                state.gpsSignalLost = true;
                state.gpsCurrentSpeedMps = 0;
                state.gpsSpeedSamples = [];
                const message = gpsErrorMessage(error);
                updateTrackingStatus(message);
                updateElapsedTime();
                if (notify) showToast(message, 'info');
                if (error.code === 1) {
                    navigator.geolocation.clearWatch(state.gpsWatchId);
                    state.gpsWatchId = null;
                    syncActivityButton();
                }
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
            syncActivityButton();
            void requestScreenWakeLock();
        }

        function stopPositionWatch() {
            if (state.gpsWatchId !== null && navigator.geolocation) {
                navigator.geolocation.clearWatch(state.gpsWatchId);
                state.gpsWatchId = null;
            }
        }

        async function startActivity(name = 'Pedalada') {
            if (state.activeActivity) {
                showToast('Já existe uma pedalada em andamento. Retome ou finalize essa atividade primeiro.', 'info');
                openTrackingModal();
                return;
            }
            try {
                const position = await getCurrentPosition();
                const firstPoint = convertGpsPosition(position, true);
                if (!firstPoint.point) throw new Error(firstPoint.error || 'O GPS ainda não forneceu uma posição válida.');
                const activityPayload = {
                    name: String(name).slice(0, 120),
                    activity_type: 'cycling',
                    status: 'in_progress',
                    tracking_mode: 'gps',
                    started_at: new Date(position.timestamp).toISOString(),
                    ended_at: null,
                    paused_at: null,
                    paused_seconds: 0,
                    distance_km: 0,
                    elevation_m: 0
                };
                if (state.authUser && window.rideXSupabase) {
                    const { data, error } = await window.rideXSupabase.from('activities').insert(activityPayload).select('*').single();
                    if (error) throw error;
                    state.activeActivity = data;
                } else {
                    state.activeActivity = {
                        ...activityPayload,
                        id: crypto.randomUUID(),
                        local_only: true,
                        points: []
                    };
                }
                state.gpsPoints = [];
                state.pendingGpsPoints = [];
                state.gpsSaveQueue = Promise.resolve();
                state.gpsSignalLost = false;
                state.gpsLastPositionAt = Date.now();
                state.gpsCurrentSpeedMps = 0;
                let firstPointError = null;
                try {
                    await persistTrackPoint(firstPoint.point);
                } catch (error) {
                    firstPointError = error;
                    console.error('Falha ao salvar a primeira posição GPS:', error);
                }
                try {
                    startPositionWatch();
                } catch (watchError) {
                    state.gpsSignalLost = true;
                    console.error('Falha ao iniciar monitoramento GPS:', watchError);
                    showToast(watchError.message || 'A pedalada foi criada, mas o monitoramento GPS não iniciou.', 'info');
                }
                openTrackingModal();
                if (state.activeActivity.local_only) {
                    persistLocalActivity();
                    syncActivityButton();
                    renderContent();
                } else if (!await refreshUserData()) return;
                showToast(firstPointError
                    ? `Pedalada iniciada, mas houve falha ao salvar a primeira posição GPS: ${firstPointError.message}`
                    : state.activeActivity.local_only
                        ? 'Pedalada iniciada. O percurso será salvo neste navegador.'
                        : 'Pedalada iniciada com localização GPS.',
                    firstPointError ? 'info' : 'success');
            } catch (error) {
                console.error('Não foi possível iniciar a pedalada:', error);
                showToast(error.message || 'Não foi possível iniciar a pedalada.', 'info');
            }
        }

        async function pauseActivity() {
            if (!state.activeActivity || state.activeActivity.status !== 'in_progress') return;
            stopPositionWatch();
            try {
                await state.gpsSaveQueue;
                const pausedAt = new Date().toISOString();
                if (state.activeActivity.local_only) {
                    state.activeActivity = { ...state.activeActivity, status: 'paused', paused_at: pausedAt };
                    state.gpsCurrentSpeedMps = 0;
                    state.gpsSpeedSamples = [];
                    await releaseScreenWakeLock();
                    persistLocalActivity();
                    syncActivityButton();
                    openTrackingModal();
                    showToast('Pedalada pausada.', 'success');
                    return;
                }
                const { data, error } = await window.rideXSupabase.from('activities').update({
                    status: 'paused',
                    paused_at: pausedAt
                }).eq('id', state.activeActivity.id).select('id').maybeSingle();
                if (error) throw error;
                if (!data) throw new Error('Pedalada não encontrada ou não autorizada.');
                state.activeActivity = { ...state.activeActivity, status: 'paused', paused_at: pausedAt };
                state.gpsCurrentSpeedMps = 0;
                state.gpsSpeedSamples = [];
                await releaseScreenWakeLock();
                syncActivityButton();
                updateTrackingStatus('Pedalada pausada · GPS desligado');
                openTrackingModal();
                showToast('Pedalada pausada.', 'success');
            } catch (error) {
                console.error('Falha ao pausar pedalada:', error);
                showToast(error.message || 'Não foi possível pausar no servidor.', 'info');
                if (state.activeActivity?.status === 'in_progress' && state.gpsWatchId === null) {
                    try {
                        startPositionWatch();
                    } catch (watchError) {
                        console.error('Falha ao retomar GPS após erro ao pausar:', watchError);
                    }
                }
            }
        }

        async function resumeActivity() {
            if (!state.activeActivity) return;
            try {
                const position = await getCurrentPosition();
                const point = convertGpsPosition(position, true);
                if (!point.point) throw new Error(point.error || 'O GPS ainda não forneceu uma posição válida.');
                if (state.activeActivity.local_only) {
                    if (state.activeActivity.status === 'paused') {
                        const pausedSeconds = Number(state.activeActivity.paused_seconds || 0)
                            + Math.max(0, Math.floor((Date.now() - Date.parse(state.activeActivity.paused_at)) / 1000));
                        state.activeActivity = { ...state.activeActivity, status: 'in_progress', paused_at: null, paused_seconds: pausedSeconds };
                    }
                    state.gpsCurrentSpeedMps = 0;
                    state.gpsSpeedSamples = [];
                    await persistTrackPoint(point.point);
                    startPositionWatch();
                    openTrackingModal();
                    showToast('Pedalada retomada.', 'success');
                    return;
                }
                if (state.pendingGpsPoints.length) await flushPendingGpsPoints();
                if (state.activeActivity.status === 'paused') {
                    const pausedSeconds = Number(state.activeActivity.paused_seconds || 0)
                        + Math.max(0, Math.floor((Date.now() - Date.parse(state.activeActivity.paused_at)) / 1000));
                    const { data, error } = await window.rideXSupabase.from('activities').update({
                        status: 'in_progress',
                        paused_at: null,
                        paused_seconds: pausedSeconds
                    }).eq('id', state.activeActivity.id).select('id').maybeSingle();
                    if (error) throw error;
                    if (!data) throw new Error('Pedalada não encontrada ou não autorizada.');
                    state.activeActivity = { ...state.activeActivity, status: 'in_progress', paused_at: null, paused_seconds: pausedSeconds };
                }
                await persistTrackPoint(point.point);
                startPositionWatch();
                openTrackingModal();
                showToast('Pedalada retomada.', 'success');
            } catch (error) {
                console.error('Falha ao retomar pedalada:', error);
                state.gpsSignalLost = true;
                showToast(error.message || 'Não foi possível retomar a pedalada; confira a permissão e o sinal GPS.', 'info');
                if (state.activeActivity) openTrackingModal();
            }
        }

        async function finishActivity() {
            if (!state.activeActivity) return;
            if (!window.confirm('Finalizar e salvar esta pedalada?')) return;
            stopPositionWatch();
            try {
                await state.gpsSaveQueue;
                if (state.activeActivity.local_only) {
                    const endedAt = new Date().toISOString();
                    const summary = calculateTrackSummary(state.gpsPoints);
                    state.activeActivity = {
                        ...state.activeActivity,
                        ...summary,
                        status: 'completed',
                        ended_at: endedAt,
                        paused_seconds: getFinalPausedSeconds(state.activeActivity, endedAt),
                        paused_at: null
                    };
                    await releaseScreenWakeLock();
                    persistLocalActivity();
                    closeModal();
                    state.activeActivity = null;
                    state.gpsPoints = [];
                    state.gpsCurrentSpeedMps = 0;
                    syncActivityButton();
                    await refreshUserData();
                    switchView('dashboard');
                    showToast('Pedalada finalizada e salva neste dispositivo.', 'success');
                    return;
                }
                if (state.pendingGpsPoints.length) await flushPendingGpsPoints();
                const summary = calculateTrackSummary(state.gpsPoints);
                const endedAt = new Date().toISOString();
                const { data, error } = await window.rideXSupabase.from('activities').update({
                    ...summary,
                    status: 'completed',
                    ended_at: endedAt,
                    paused_seconds: getFinalPausedSeconds(state.activeActivity, endedAt),
                    paused_at: null
                }).eq('id', state.activeActivity.id).select('id').maybeSingle();
                if (error) throw error;
                if (!data) throw new Error('Pedalada não encontrada ou não autorizada.');
                await releaseScreenWakeLock();
                closeModal();
                state.pendingGpsPoints = [];
                persistPendingGpsPoints();
                state.activeActivity = null;
                state.gpsPoints = [];
                syncActivityButton();
                if (!await refreshUserData()) return;
                showToast('Pedalada finalizada e salva.', 'success');
            } catch (error) {
                console.error('Falha ao finalizar pedalada:', error);
                showToast(error.message || 'Não foi possível finalizar a pedalada; ela continua recuperável.', 'info');
                if (state.activeActivity && state.gpsWatchId === null && state.activeActivity.status === 'in_progress') {
                    startPositionWatch();
                }
            }
        }

        function handleVisibilityChange() {
            if (document.visibilityState === 'hidden' && state.activeActivity?.status === 'in_progress') {
                state.backgroundRecordingWarning = true;
            } else if (document.visibilityState === 'visible' && state.backgroundRecordingWarning) {
                state.backgroundRecordingWarning = false;
                showToast('A gravação em segundo plano não é garantida. O trecho sem posições GPS não pode ser reconstruído.', 'info');
            }
            if (document.visibilityState === 'visible' && state.activeActivity?.status === 'in_progress') {
                void requestScreenWakeLock();
            }
        }

        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('beforeunload', event => {
            if (state.activeActivity?.status === 'in_progress') {
                event.preventDefault();
                event.returnValue = '';
            }
        });

        function parseGpxPoints(xmlText) {
            const documentXml = new DOMParser().parseFromString(xmlText, 'application/xml');
            if (documentXml.querySelector('parsererror')) throw new Error('O arquivo não contém XML/GPX válido.');
            let sourceGroups = [...documentXml.querySelectorAll('trkseg, rte')]
                .map(group => [...group.children].filter(point => point.localName === 'trkpt' || point.localName === 'rtept'))
                .filter(group => group.length > 0);
            if (!sourceGroups.length) {
                const ungroupedPoints = [...documentXml.querySelectorAll('trkpt, rtept')];
                if (ungroupedPoints.length) sourceGroups = [ungroupedPoints];
            }
            const sourcePoints = sourceGroups.flat();
            if (!sourcePoints.length) throw new Error('O GPX não contém pontos de trilha (trkpt/rtept).');
            if (sourcePoints.length > 20000) throw new Error('O GPX excede o limite de 20.000 pontos por importação.');
            const points = [];
            for (const group of sourceGroups) {
                let firstAcceptedInSegment = true;
                for (const node of group) {
                    const latitudeText = node.getAttribute('lat');
                    const longitudeText = node.getAttribute('lon');
                    const latitude = latitudeText === null || latitudeText.trim() === '' ? NaN : Number(latitudeText);
                    const longitude = longitudeText === null || longitudeText.trim() === '' ? NaN : Number(longitudeText);
                    const elevationText = node.querySelector('ele')?.textContent?.trim();
                    const timeText = node.querySelector('time')?.textContent?.trim();
                    const altitude = elevationText ? Number(elevationText) : null;
                    const timestamp = timeText ? Date.parse(timeText) : null;
                    const point = {
                        latitude,
                        longitude,
                        accuracy_m: null,
                        altitude_m: Number.isFinite(altitude) && altitude >= -12000 && altitude <= 100000 ? altitude : null,
                        recorded_at: Number.isFinite(timestamp) ? new Date(timestamp).toISOString() : null,
                        segment_start: firstAcceptedInSegment,
                        source: 'gpx'
                    };
                    const valid = validateTrackPoint(point, points, true);
                    if (valid.point) {
                        points.push(valid.point);
                        firstAcceptedInSegment = false;
                    }
                }
            }
            if (!points.length) throw new Error('Nenhum ponto GPX válido permaneceu após a validação.');
            if (points.length > 20000) throw new Error('O GPX excede o limite de 20.000 pontos por importação.');
            return points;
        }

        async function importGpxFile() {
            if (!requireAuthenticatedUser()) return;
            const input = document.getElementById('gpx-file');
            const file = input?.files?.[0];
            if (!file) {
                showToast('Selecione um arquivo GPX para importar.', 'info');
                return;
            }
            if (state.activeActivity) {
                showToast('Finalize a pedalada ativa antes de importar um GPX.', 'info');
                return;
            }
            if (file.size > 10 * 1024 * 1024 || !/\.gpx$/i.test(file.name)) {
                showToast('Selecione um arquivo .gpx de até 10 MB.', 'info');
                return;
            }
            try {
                const points = parseGpxPoints(await file.text());
                const summary = calculateTrackSummary(points);
                const recordedTimes = points.map(point => point.recorded_at).filter(Boolean).sort();
                const importedAt = new Date().toISOString();
                const startedAt = recordedTimes[0] || importedAt;
                const endedAt = recordedTimes[recordedTimes.length - 1] || startedAt;
                const { data: activity, error: activityError } = await window.rideXSupabase.from('activities').insert({
                    name: file.name.replace(/\.gpx$/i, '').slice(0, 120) || 'Trilha GPX',
                    activity_type: 'cycling',
                    tracking_mode: 'gpx',
                    status: 'completed',
                    started_at: startedAt,
                    ended_at: endedAt,
                    distance_km: summary.distance_km,
                    elevation_m: summary.elevation_m,
                    notes: recordedTimes.length ? 'Importada de GPX.' : 'Importada de GPX; o arquivo não continha horários dos pontos.'
                }).select('id').single();
                if (activityError) throw activityError;
                try {
                    for (let offset = 0; offset < points.length; offset += 500) {
                        const rows = points.slice(offset, offset + 500).map((point, index) => ({
                            ...point,
                            activity_id: activity.id,
                            user_id: state.authUser.id,
                            sequence: offset + index
                        }));
                        const { error } = await window.rideXSupabase.from('activity_points').insert(rows);
                        if (error) throw error;
                    }
                } catch (error) {
                    const { error: rollbackError } = await window.rideXSupabase.from('activities').delete().eq('id', activity.id);
                    if (rollbackError) {
                        console.error('Falha ao remover importação GPX parcial:', rollbackError);
                        throw new Error(`${error.message || 'Erro ao gravar pontos GPX.'} A limpeza também falhou; a atividade parcial pode permanecer no banco.`);
                    }
                    throw error;
                }
                if (!await refreshUserData()) return;
                showToast(`${points.length} pontos GPX importados · ${summary.distance_km.toLocaleString('pt-BR')} km calculados.`, 'success');
                input.value = '';
            } catch (error) {
                console.error('Falha ao importar GPX:', error);
                showToast(error.message || 'Não foi possível importar o arquivo GPX.', 'info');
            }
        }

        function openQuickActionModal() {
            openActivityModal();
        }

        function openNewRouteModal() {
            openModal('Mapear Nova Trilha', `
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 font-medium">Título da Trilha</label>
                        <input type="text" placeholder="Ex: Travessia dos Altos" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 font-medium">Localização</label>
                        <input type="text" placeholder="Cidade, Estado" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime">
                    </div>
                </div>
            `);
        }

        function openNotificationsModal() {
            openModal('Notificações Recentes', `
                <div class="space-y-3">
                    <div class="p-3 rounded-xl bg-grafite-700/50 border border-grafite-600 flex items-start gap-3">
                        <i class="fa-solid fa-trophy text-lime mt-1"></i>
                        <div>
                            <h4 class="text-sm font-bold text-white">Novo KOM Conquistado!</h4>
                            <p class="text-xs text-slate-400">Você bateu o recorde na subida da Serra do Rastro.</p>
                        </div>
                    </div>
                    <div class="p-3 rounded-xl bg-grafite-700/50 border border-grafite-600 flex items-start gap-3">
                        <i class="fa-solid fa-bicycle text-lime mt-1"></i>
                        <div>
                            <h4 class="text-sm font-bold text-white">Manutenção Preventiva</h4>
                            <p class="text-xs text-slate-400">Sua corrente atingiu 75% de desgaste sugerido.</p>
                        </div>
                    </div>
                </div>
            `);
        }

        // Initialize default view on load
        window.onload = async function() {
            const supabase = window.rideXSupabase;
            if (supabase) {
                try {
                    const { data, error } = await supabase.auth.getSession();
                    if (error) throw error;
                    state.authUser = data.session?.user || null;
                } catch (error) {
                    console.error('Falha ao restaurar sessão Supabase:', error);
                    showToast(error.message || 'Não foi possível restaurar sua sessão.', 'info');
                }
                supabase.auth.onAuthStateChange((_event, session) => {
                    if (!session?.user) stopPositionWatch();
                    state.authUser = session?.user || null;
                    if (!state.authUser) state.userProfile = null;
                    updateAuthInterface();
                    void refreshUserData();
                });
            }
            updateAuthInterface();
            const requestedView = new URLSearchParams(window.location.search).get('view');
            switchView(requestedView === 'settings' ? 'settings' : 'landing');
            await refreshUserData();
        };
    </script>
</body>
