<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B0D0F">
    <title>RIDE X | Outdoor Premium Experience</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lime: {
                            DEFAULT: '#B7F34A',
                            hover: '#a3df3b',
                            light: '#d2f781',
                            dark: '#8cc229'
                        },
                        grafite: {
                            900: '#0B0D0F',
                            800: '#121417',
                            700: '#1C2026',
                            600: '#2A303A',
                            500: '#3E4756'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121417;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A303A;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B7F34A;
        }
        .glass-panel {
            background: rgba(28, 32, 38, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(183, 243, 74, 0.12);
        }
        .glass-panel-hover:hover {
            border-color: rgba(183, 243, 74, 0.4);
            box-shadow: 0 10px 30px -10px rgba(183, 243, 74, 0.15);
        }
        .glow-lime {
            box-shadow: 0 0 25px -5px rgba(183, 243, 74, 0.35);
        }
        .text-glow {
            text-shadow: 0 0 12px rgba(183, 243, 74, 0.4);
        }
        #home-map {
            min-height: 360px;
            background: #1C2026;
        }
        #tracking-metrics-map {
            height: min(34dvh, 320px);
            min-height: 200px;
            background: #1C2026;
        }
        @supports not (height: 1dvh) {
            #tracking-metrics-map {
                height: min(34vh, 320px);
            }
            #app-wrapper {
                height: 100vh;
            }
        }
        .safe-area-button {
            right: max(1.5rem, env(safe-area-inset-right));
            bottom: max(1.5rem, env(safe-area-inset-bottom));
        }
        .safe-area-modal {
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }
        #global-modal.tracking-modal-open {
            padding: 0;
        }
        #global-modal.tracking-modal-open > .tracking-screen-panel {
            width: min(100%, 1080px);
            max-height: min(94dvh, 940px);
            overflow: hidden;
            padding: 0;
            border-color: rgba(183, 243, 74, 0.22);
            background: #0b0d0f;
            box-shadow: 0 32px 100px rgba(0, 0, 0, 0.6), 0 0 60px rgba(183, 243, 74, 0.08);
        }
        #global-modal.tracking-modal-open .tracking-screen-header {
            min-height: 68px;
        }
        #global-modal.tracking-modal-open .tracking-screen-header h3 {
            font-size: 0.95rem;
            letter-spacing: 0.01em;
        }
        #global-modal.tracking-modal-open .tracking-screen-header > button {
            display: grid;
            width: 2.5rem;
            height: 2.5rem;
            place-items: center;
            border-radius: 0.8rem;
            background: rgba(255, 255, 255, 0.06);
        }
        .tracking-screen-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(18, 20, 23, 0.96);
        }
        .tracking-screen-body {
            display: grid;
            gap: 1rem;
            max-height: calc(min(94dvh, 940px) - 68px);
            overflow-y: auto;
            padding: 1.25rem 1.5rem 1.5rem;
        }
        .tracking-hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 1.25rem;
            padding: clamp(1.1rem, 3vw, 2rem);
            border: 1px solid rgba(183, 243, 74, 0.15);
            border-radius: 1.5rem;
            background: radial-gradient(ellipse at 0% 0%, rgba(183, 243, 74, 0.12), transparent 56%), linear-gradient(135deg, #171b1e, #101214 72%);
        }
        .tracking-speed-value {
            display: block;
            color: #b7f34a;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            font-weight: 900;
            letter-spacing: -0.085em;
            line-height: 0.95;
            font-variant-numeric: tabular-nums;
        }
        .tracking-stat-card {
            min-width: 0;
            padding: 1rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.075);
            border-radius: 1rem;
            background: linear-gradient(145deg, rgba(28, 32, 38, 0.92), rgba(18, 20, 23, 0.94));
        }
        .tracking-map-shell {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            background: #121417;
        }
        .leaflet-container {
            background: #111519;
            font: inherit;
        }
        .leaflet-tile {
            filter: brightness(0.72) invert(1) hue-rotate(180deg) saturate(0.55) contrast(0.9);
        }
        .leaflet-control-zoom a {
            border-color: rgba(255, 255, 255, 0.12) !important;
            background: rgba(18, 20, 23, 0.94) !important;
            color: #f1f5f9 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #252b30 !important;
            color: #b7f34a !important;
        }
        .leaflet-control-attribution {
            background: rgba(11, 13, 15, 0.78) !important;
            color: #cbd5e1 !important;
        }
        .leaflet-control-attribution a {
            color: #b7f34a !important;
        }
        .tracking-map-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .tracking-screen-actions {
            position: sticky;
            bottom: 0;
            z-index: 500;
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            padding: 0.9rem 0 0.25rem;
            background: linear-gradient(180deg, transparent, #0b0d0f 28%);
        }
        @media (max-width: 640px) {
            #global-modal.tracking-modal-open {
                align-items: stretch;
                padding: 0;
            }
            #global-modal.tracking-modal-open > .tracking-screen-panel {
                width: 100%;
                height: 100dvh;
                max-height: 100dvh;
                min-height: 0;
                border: 0;
                border-radius: 0;
                padding-bottom: env(safe-area-inset-bottom);
            }
            .tracking-screen-header {
                flex: 0 0 auto;
                padding: max(0.85rem, env(safe-area-inset-top)) 1rem 0.85rem;
            }
            .tracking-screen-body {
                align-content: start;
                gap: 0.75rem;
                max-height: none;
                height: calc(100dvh - 71px - env(safe-area-inset-top));
                padding: 0.85rem 1rem max(1rem, env(safe-area-inset-bottom));
            }
            .tracking-hero {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.5rem;
                padding: 1rem;
                border-radius: 1.15rem;
            }
            .tracking-speed-value {
                font-size: clamp(3.25rem, 18vw, 5rem);
            }
            .tracking-stat-card {
                padding: 0.8rem 0.7rem;
                border-radius: 0.85rem;
            }
            #tracking-metrics-map {
                height: clamp(180px, 27dvh, 280px);
                min-height: 180px;
            }
            .tracking-screen-actions {
                justify-content: stretch;
                padding-top: 0.75rem;
            }
            .tracking-screen-actions button {
                flex: 1;
                min-height: 3.25rem;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="bg-grafite-800 text-slate-100 font-sans antialiased selection:bg-lime selection:text-grafite-900 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed bottom-24 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>
    <button id="activity-toggle" onclick="handleActivityButton()" aria-label="Iniciar atividade" class="safe-area-button fixed z-40 flex items-center gap-3 rounded-full bg-lime px-5 py-4 font-bold text-grafite-900 shadow-xl shadow-lime/25 transition-all hover:scale-105 hover:bg-lime-hover focus:outline-none focus:ring-2 focus:ring-lime focus:ring-offset-2 focus:ring-offset-grafite-900">
        <i class="fa-solid fa-play"></i>
        <span>Iniciar Atividade</span>
    </button>

    <!-- MAIN APP WRAPPER -->
    <div id="app-wrapper" class="flex h-dvh overflow-hidden">

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-grafite-900 border-r border-grafite-600 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0 lg:static lg:inset-auto">
            <!-- Brand Header -->
            <div class="h-20 flex items-center justify-between px-6 border-b border-grafite-600">
                <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('landing')">
                    <div class="w-10 h-10 rounded-xl bg-lime flex items-center justify-center text-grafite-900 font-black text-xl glow-lime">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-black tracking-wider text-white">RIDE<span class="text-lime">X</span></span>
                        <span class="block text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Outdoor Ecosystem</span>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <div class="flex-1 overflow-y-auto px-4 py-6 space-y-2">
                <div class="px-3 pb-2 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Plataforma</div>
                
                <button onclick="switchView('landing')" id="nav-landing" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-300 hover:bg-grafite-700 hover:text-white transition-all group">
                    <i class="fa-solid fa-compass text-lg text-slate-400 group-hover:text-lime transition-colors"></i>
                    <span>Landing Page</span>
                </button>

                <button onclick="switchView('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-300 hover:bg-grafite-700 hover:text-white transition-all group">
                    <i class="fa-solid fa-chart-line text-lg text-slate-400 group-hover:text-lime transition-colors"></i>
                    <span>Dashboard</span>
                    <span class="ml-auto bg-lime/10 text-lime text-xs px-2 py-0.5 rounded-full font-semibold">Live</span>
                </button>

                <button onclick="switchView('routes')" id="nav-routes" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-300 hover:bg-grafite-700 hover:text-white transition-all group">
                    <i class="fa-solid fa-route text-lg text-slate-400 group-hover:text-lime transition-colors"></i>
                    <span>Trilhas & Rotas</span>
                </button>

                <button onclick="switchView('community')" id="nav-community" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-300 hover:bg-grafite-700 hover:text-white transition-all group">
                    <i class="fa-solid fa-users text-lg text-slate-400 group-hover:text-lime transition-colors"></i>
                    <span>Comunidade</span>
                </button>

                <button onclick="switchView('equipment')" id="nav-equipment" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-300 hover:bg-grafite-700 hover:text-white transition-all group">
                    <i class="fa-solid fa-bicycle text-lg text-slate-400 group-hover:text-lime transition-colors"></i>
                    <span>Equipamentos</span>
                </button>

                <div class="pt-6 px-3 pb-2 text-[11px] font-bold text-slate-500 uppercase tracking-wider">Sistema</div>

                <button onclick="switchView('settings')" id="nav-settings" class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-300 hover:bg-grafite-700 hover:text-white transition-all group">
                    <i class="fa-solid fa-user-gear text-lg text-slate-400 group-hover:text-lime transition-colors"></i>
                    <span>Minha conta</span>
                </button>
            </div>

            <!-- User Mini Profile Footer -->
            <div class="p-4 border-t border-grafite-600 bg-grafite-900/80">
                <div class="flex items-center gap-3 p-2 rounded-xl bg-grafite-700/50 border border-grafite-600">
                    <img src="https://placehold.co/120x120/1C2026/B7F34A?text=RX" alt="Avatar" class="w-10 h-10 rounded-lg object-cover border border-lime/30">
                    <div class="flex-1 min-w-0">
                        <h4 id="profile-name" class="text-sm font-semibold text-white truncate">Visitante</h4>
                        <p id="profile-status" class="text-xs text-lime flex items-center gap-1 font-medium">
                            <i class="fa-solid fa-shield-halved text-[10px]"></i> Pro Rider
                        </p>
                    </div>
                    <button id="auth-action" onclick="openAuthModal()" class="text-slate-400 hover:text-white p-2" aria-label="Entrar ou cadastrar">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Header Bar -->
            <header class="h-20 bg-grafite-800/90 backdrop-blur border-b border-grafite-600 flex items-center justify-between px-6 lg:px-10 z-30 shrink-0">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="lg:hidden text-slate-300 hover:text-white p-2 rounded-lg bg-grafite-700">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div>
                        <h1 id="view-title" class="text-xl lg:text-2xl font-bold text-white tracking-tight">Landing Page</h1>
                        <p id="view-subtitle" class="text-xs text-slate-400 hidden sm:block">Explore o design system e a plataforma RIDE X</p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <button id="header-auth-action" onclick="openAuthModal()" class="px-3 py-2 rounded-xl bg-grafite-700 text-slate-200 hover:bg-grafite-600 text-sm font-semibold border border-grafite-600">
                        Entrar
                    </button>
                    <!-- Quick Search -->
                    <div class="relative hidden md:block w-64">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" placeholder="Buscar rotas, atletas, gear..." class="w-full bg-grafite-700 text-sm text-slate-200 pl-9 pr-4 py-2 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime transition-all">
                    </div>

                    <!-- Notifications Button -->
                    <button onclick="openNotificationsModal()" class="relative p-2.5 rounded-xl bg-grafite-700 text-slate-300 hover:text-white hover:bg-grafite-600 transition-all border border-grafite-600">
                        <i class="fa-regular fa-bell text-lg"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-lime"></span>
                    </button>

                    <!-- Primary Action Button -->
                    <button onclick="openQuickActionModal()" class="hidden sm:flex items-center gap-2 px-4 py-2.5 rounded-xl bg-lime hover:bg-lime-hover text-grafite-900 font-bold text-sm transition-all shadow-lg shadow-lime/20">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Nova Atividade</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <main id="main-content" class="flex-1 overflow-y-auto bg-grafite-800 p-6 lg:p-10">
                <!-- Content injected dynamically via JavaScript -->
            </main>
        </div>
    </div>

    <div id="global-modal" class="safe-area-modal fixed inset-0 z-50 hidden items-center justify-center bg-grafite-900/80 backdrop-blur-sm">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 border border-grafite-600 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200">
            <div class="flex items-center justify-between pb-4 border-b border-grafite-600">
                <h3 id="modal-title" class="text-lg font-bold text-white">Título do Modal</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modal-body" class="py-6 space-y-4">
                <!-- Dynamic Modal Content -->
            </div>
            <div id="modal-footer" class="flex items-center justify-end gap-3 pt-4 border-t border-grafite-600">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-grafite-700 hover:bg-grafite-600 text-slate-300 text-sm font-medium transition-all">Cancelar</button>
                <button id="modal-confirm-btn" onclick="closeModal(); showToast('Ação realizada com sucesso!', 'success')" class="px-5 py-2 rounded-xl bg-lime hover:bg-lime-hover text-grafite-900 text-sm font-bold transition-all">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module" src="./src/supabase.js"></script>
    <script>
        // Mock State Data
        const state = {
            currentView: 'landing',
            user: {
                name: 'Marcus Silva',
                handle: '@marcus_ride',
                level: 'Pro Rider',
                stats: {
                    distance: '1,420 km',
                    elevation: '24,800 m',
                    rides: '58',
                    kom: '12'
                }
            },
            activities: [],
            bicycles: [],
            activeActivity: null,
            gpsPoints: [],
            pendingGpsPoints: [],
            gpsWatchId: null,
            gpsSignalLost: false,
            gpsCurrentSpeedMps: 0,
            gpsSpeedSamples: [],
            gpsAccuracyMeters: null,
            gpsLastPositionAt: null,
            screenWakeLock: null,
            gpsSaveQueue: Promise.resolve(),
            trackingTimer: null,
            backgroundRecordingWarning: false,
            authUser: null,
            userProfile: null,
            routes: [
                { id: 1, name: 'Serra do Rio do Rastro', location: 'Santa Catarina, BR', distance: '24.2 km', elevation: '1,240 m', difficulty: 'Extrema', rating: '4.9', image: 'https://placehold.co/600x400/1C2026/B7F34A?text=Serra+Rastro' },
                { id: 2, name: 'Trilha dos Canions', location: 'Cambará do Sul, RS', distance: '48.5 km', elevation: '850 m', difficulty: 'Moderada', rating: '4.8', image: 'https://placehold.co/600x400/1C2026/B7F34A?text=Canions+RS' },
                { id: 3, name: 'Volta das Hortênsias', location: 'Gramado, RS', distance: '65.0 km', elevation: '1,100 m', difficulty: 'Avançada', rating: '4.7', image: 'https://placehold.co/600x400/1C2026/B7F34A?text=Hortensias' },
                { id: 4, name: 'Gravel Ruta 40 Brasil', location: 'São Joaquim, SC', distance: '92.4 km', elevation: '1,650 m', difficulty: 'Extrema', rating: '5.0', image: 'https://placehold.co/600x400/1C2026/B7F34A?text=Gravel+Serrana' }
            ],
            pointsOfInterest: [
                { name: 'Mirante da Serra do Rio do Rastro', type: 'Mirante', coordinates: [-28.3958, -49.5506] },
                { name: 'Bom Jardim da Serra', type: 'Ponto de apoio', coordinates: [-28.337, -49.63] },
                { name: 'Urubici', type: 'Destino outdoor', coordinates: [-28.015, -49.592] },
                { name: 'São Joaquim', type: 'Destino outdoor', coordinates: [-28.293, -49.931] }
            ],
            community: [
                { id: 1, author: 'Juliana Costa', time: 'Há 2 horas', content: 'Conquistamos o topo da Serra do Rastro com o novo setup gravel! Visual incrível e temperatura perfeita.', likes: 142, comments: 24, image: 'https://placehold.co/600x350/1C2026/B7F34A?text=Post+Juliana' },
                { id: 2, author: 'Carlos Eduardo', time: 'Há 5 horas', content: 'Testando os novos pneus tubeless 45mm na lama de Cambará. A aderência superou todas as expectativas.', likes: 89, comments: 12, image: 'https://placehold.co/600x350/1C2026/B7F34A?text=Post+Carlos' }
            ],
        };

        let landingMap = null;
        let activityMap = null;
        let activityTrackLine = null;
        let activityPositionMarker = null;
        let activityMapActivityId = null;
        let editingActivityId = null;
        let editingBicycleId = null;

        // Navigation Switcher
        function switchView(viewName) {
            state.currentView = viewName;
            
            // Update active state in sidebar
            document.querySelectorAll('aside button[id^="nav-"]').forEach(btn => {
                btn.classList.remove('bg-grafite-700', 'text-white', 'border-l-4', 'border-lime');
                btn.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById(`nav-${viewName}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-300');
                activeBtn.classList.add('bg-grafite-700', 'text-white');
            }

            // Update Header Title
            const titles = {
                landing: { title: 'Landing Page RIDE X', subtitle: 'Design system outdoor premium e apresentação' },
                dashboard: { title: 'Dashboard Geral', subtitle: 'Visão panorâmica de desempenho e métricas' },
                routes: { title: 'Trilhas & Rotas Pro', subtitle: 'Explore trajetos mapeados para aventura' },
                community: { title: 'Comunidade Outdoor', subtitle: 'Conecte-se com atletas e compartilhe conquistas' },
                equipment: { title: 'Minhas Bicicletas', subtitle: 'Cadastre e gerencie suas bicicletas' },
                settings: { title: 'Minha conta', subtitle: 'Seu perfil e informações pessoais' }
            };

            if (titles[viewName]) {
                document.getElementById('view-title').innerText = titles[viewName].title;
                document.getElementById('view-subtitle').innerText = titles[viewName].subtitle;
            }

            // Render view content
            renderContent();

            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('-translate-x-full');
        }

        // Render Content Dispatcher
        function renderContent() {
            const main = document.getElementById('main-content');

        function addRideXMapTiles(map) {
            return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);
        }

        function initializeLandingMap() {
            const mapElement = document.getElementById('home-map');
            const status = document.getElementById('map-status');
            if (!window.L) {
                status.textContent = 'Não foi possível carregar o mapa. Verifique sua conexão e tente novamente.';
                return;
            }

            landingMap = L.map(mapElement).setView([-28.25, -49.7], 8);
            addRideXMapTiles(landingMap);

            state.pointsOfInterest.forEach(point => {
                L.circleMarker(point.coordinates, {
                    radius: 8,
                    color: '#0B0D0F',
                    weight: 2,
                    fillColor: '#B7F34A',
                    fillOpacity: 1
                }).addTo(landingMap).bindPopup(`<strong>${point.name}</strong><br>${point.type}`);
            });
            status.textContent = 'Mapa da Serra Catarinense · Selecione um ponto para ver detalhes.';
        }

        function focusMapPoint(pointIndex) {
            if (!landingMap || !state.pointsOfInterest[pointIndex]) {
                return;
            }
            const point = state.pointsOfInterest[pointIndex];
            landingMap.setView(point.coordinates, 11);
        }

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const borderColor = type === 'success' ? 'border-lime/40 text-lime' : 'border-sky-500/40 text-sky-400';
            
            toast.className = `glass-panel px-5 py-4 rounded-2xl border ${borderColor} shadow-2xl flex items-center gap-3 pointer-events-auto animate-in fade-in slide-in-from-bottom-5 duration-300`;
            const icon = document.createElement('i');
            icon.className = `fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-lg`;
            const text = document.createElement('span');
            text.className = 'text-sm font-semibold text-white';
            text.textContent = message;
            toast.append(icon, text);
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Modal Controllers
        function disposeActivityMap() {
            if (activityMap) activityMap.remove();
            activityMap = null;
            activityTrackLine = null;
            activityPositionMarker = null;
            activityMapActivityId = null;
            if (state.trackingTimer) {
                clearInterval(state.trackingTimer);
                state.trackingTimer = null;
            }
        }

        function openModal(title, bodyHTML) {
            disposeActivityMap();
            const modal = document.getElementById('global-modal');
            const modalPanel = modal.querySelector('.glass-panel');
            modal.classList.remove('tracking-modal-open');
            modalPanel.classList.remove('tracking-screen-panel');
            modalPanel.firstElementChild.classList.remove('tracking-screen-header');
            document.getElementById('modal-body').classList.remove('tracking-screen-body');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            document.getElementById('modal-footer').classList.remove('hidden');
            document.querySelector('#global-modal .glass-panel').classList.remove('max-w-4xl');
            document.querySelector('#global-modal .glass-panel').classList.remove('max-w-5xl', 'max-h-[95vh]', 'overflow-y-auto');
            document.querySelector('#global-modal .glass-panel').classList.add('max-w-lg');
            const confirmButton = document.getElementById('modal-confirm-btn');
            confirmButton.classList.remove('hidden');
            confirmButton.textContent = 'Confirmar';
            confirmButton.onclick = () => {
                closeModal();
                showToast('Ação realizada com sucesso!', 'success');
            };
            document.getElementById('global-modal').classList.remove('hidden');
            document.getElementById('global-modal').classList.add('flex');
        }

        function setModalAction(label, action) {
            const confirmButton = document.getElementById('modal-confirm-btn');
            confirmButton.textContent = label;
            confirmButton.onclick = action;
        }

        function closeModal() {
            document.getElementById('global-modal').classList.remove('tracking-modal-open');
            document.getElementById('global-modal').classList.add('hidden');
            document.getElementById('global-modal').classList.remove('flex');
            document.getElementById('modal-footer').classList.remove('hidden');
            document.querySelector('#global-modal .glass-panel').classList.remove('max-w-4xl');
            document.querySelector('#global-modal .glass-panel').classList.remove('max-w-5xl', 'max-h-[95vh]', 'overflow-y-auto');
            document.querySelector('#global-modal .glass-panel').classList.add('max-w-lg');
            disposeActivityMap();
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function requireAuthenticatedUser() {
            if (!window.rideXSupabase) {
                showToast('Configure VITE_SUPABASE_URL e VITE_SUPABASE_PUBLISHABLE_KEY para conectar ao Supabase.', 'info');
                openAuthModal();
                return false;
            }
            if (!state.authUser) {
                openAuthModal();
                return false;
            }
            return true;
        }

        function openAuthModal(mode = 'signin') {
            state.authMode = mode;
            if (!window.rideXSupabase) {
                openModal('Configurar Supabase', `
                    <p class="text-sm text-slate-300">Defina <code>VITE_SUPABASE_URL</code> e <code>VITE_SUPABASE_PUBLISHABLE_KEY</code> no arquivo <code>.env.local</code> e reinicie o servidor de desenvolvimento.</p>
                `);
                setModalAction('Entendi', closeModal);
                return;
            }
            renderAuthModal();
        }

        function renderAuthModal() {
            const isSignup = state.authMode === 'signup';
            openModal(isSignup ? 'Criar sua conta RIDE X' : 'Entrar na RIDE X', `
                <div class="space-y-4">
                    <button type="button" onclick="signInWithGoogle()" class="flex w-full items-center justify-center gap-3 rounded-xl border border-grafite-500 bg-white px-4 py-3 text-sm font-bold text-grafite-900 transition hover:bg-slate-100"><i class="fa-brands fa-google text-base"></i>Continuar com Google</button>
                    <div class="flex items-center gap-3 text-xs text-slate-500"><span class="h-px flex-1 bg-grafite-600"></span>ou use seu e-mail<span class="h-px flex-1 bg-grafite-600"></span></div>
                    ${isSignup ? `<div><label for="auth-name" class="text-xs text-slate-400 font-medium">Nome</label><input id="auth-name" type="text" maxlength="80" autocomplete="name" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>` : ''}
                    <div><label for="auth-email" class="text-xs text-slate-400 font-medium">E-mail</label><input id="auth-email" type="email" maxlength="254" autocomplete="email" required class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>
                    <div><label for="auth-password" class="text-xs text-slate-400 font-medium">Senha</label><input id="auth-password" type="password" minlength="8" maxlength="72" autocomplete="${isSignup ? 'new-password' : 'current-password'}" required class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>
                    <button onclick="openAuthModal('${isSignup ? 'signin' : 'signup'}')" class="text-sm text-lime hover:underline">${isSignup ? 'Já tem uma conta? Entrar' : 'Não tem conta? Cadastre-se'}</button>
                </div>
            `);
            setModalAction(isSignup ? 'Criar conta' : 'Entrar', submitAuthForm);
        }

        async function signInWithGoogle() {
            if (!window.rideXSupabase) {
                showToast('O login está indisponível: configure a conexão com o Supabase.', 'info');
                return;
            }
            try {
                const redirectTo = `${window.location.origin}${window.location.pathname}?view=settings`;
                const { error } = await window.rideXSupabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo }
                });
                if (error) throw error;
            } catch (error) {
                console.error('Falha ao iniciar login com Google:', error);
                showToast(error.message || 'Não foi possível entrar com o Google. Verifique a configuração do provedor no Supabase.', 'info');
            }
        }

        async function submitAuthForm() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            if (!email || password.length < 8) {
                showToast('Informe um e-mail e uma senha com pelo menos 8 caracteres.', 'info');
                return;
            }
            try {
                let result;
                if (state.authMode === 'signup') {
                    const name = document.getElementById('auth-name').value.trim();
                    if (!name || name.length > 80) {
                        showToast('Informe seu nome (até 80 caracteres).', 'info');
                        return;
                    }
                    result = await window.rideXSupabase.auth.signUp({
                        email,
                        password,
                        options: { data: { full_name: name } }
                    });
                } else {
                    result = await window.rideXSupabase.auth.signInWithPassword({ email, password });
                }
                if (result.error) throw result.error;
                if (state.authMode === 'signup' && !result.data.session) {
                    closeModal();
                    showToast('Conta criada. Confirme seu e-mail para entrar.', 'success');
                    return;
                }
                closeModal();
                showToast(state.authMode === 'signup' ? 'Conta criada com sucesso.' : 'Login realizado com sucesso.', 'success');
            } catch (error) {
                console.error('Falha na autenticação Supabase:', error);
                showToast(error.message || 'Não foi possível autenticar sua conta.', 'info');
            }
        }

        async function signOut() {
            if (!window.rideXSupabase) return;
            if (state.activeActivity?.status === 'in_progress') await pauseActivity();
            const { error } = await window.rideXSupabase.auth.signOut();
            if (error) {
                console.error('Falha ao sair da conta:', error);
                showToast(error.message || 'Não foi possível encerrar a sessão.', 'info');
                return;
            }
            showToast('Sessão encerrada com segurança.', 'success');
        }

        function updateAuthInterface() {
            const name = state.userProfile?.full_name || state.authUser?.user_metadata?.full_name || state.authUser?.user_metadata?.name || state.authUser?.email || 'Visitante';
            document.getElementById('profile-name').textContent = name;
            document.getElementById('profile-status').innerHTML = state.authUser
                ? '<i class="fa-solid fa-shield-halved text-[10px]"></i> Conta conectada'
                : '<i class="fa-solid fa-user text-[10px]"></i> Entre para sincronizar';
            document.getElementById('auth-action').innerHTML = state.authUser
                ? '<i class="fa-solid fa-right-from-bracket"></i>'
                : '<i class="fa-solid fa-right-to-bracket"></i>';
            document.getElementById('auth-action').setAttribute('aria-label', state.authUser ? 'Sair da conta' : 'Entrar ou cadastrar');
            document.getElementById('auth-action').onclick = state.authUser ? signOut : () => openAuthModal();
            document.getElementById('header-auth-action').textContent = state.authUser ? 'Sair' : 'Entrar';
            document.getElementById('header-auth-action').onclick = state.authUser ? signOut : () => openAuthModal();
            syncActivityButton();
        }

        async function saveUserProfile(event) {
            event.preventDefault();
            if (!requireAuthenticatedUser()) return;
            const form = event.currentTarget;
            const formData = new FormData(form);
            const numberOrNull = name => {
                const value = String(formData.get(name) || '').trim();
                return value === '' ? null : Number(value);
            };
            const profile = {
                user_id: state.authUser.id,
                full_name: String(formData.get('full_name') || '').trim(),
                handle: String(formData.get('handle') || '').trim() || null,
                age: numberOrNull('age'),
                height_cm: numberOrNull('height_cm'),
                weight_kg: numberOrNull('weight_kg'),
                bio: String(formData.get('bio') || '').trim()
            };
            if (!profile.full_name || profile.full_name.length > 80
                || (profile.handle && profile.handle.length > 30)
                || (profile.age !== null && (!Number.isInteger(profile.age) || profile.age < 1 || profile.age > 120))
                || (profile.height_cm !== null && (!Number.isInteger(profile.height_cm) || profile.height_cm < 80 || profile.height_cm > 250))
                || (profile.weight_kg !== null && (!Number.isFinite(profile.weight_kg) || profile.weight_kg < 20 || profile.weight_kg > 350))
                || profile.bio.length > 500) {
                showToast('Revise os dados: nome (até 80 caracteres), apelido (até 30), idade (1–120), altura (80–250 cm), peso (20–350 kg) e descrição (até 500 caracteres).', 'info');
                return;
            }
            const saveButton = form.querySelector('button[type="submit"]');
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Salvando...';
            try {
                const { data, error } = await window.rideXSupabase.from('profiles')
                    .upsert(profile, { onConflict: 'user_id' })
                    .select('user_id,full_name,handle,age,height_cm,weight_kg,bio')
                    .single();
                if (error) throw error;
                state.userProfile = data;
                updateAuthInterface();
                renderContent();
                showToast('Perfil salvo na sua conta.', 'success');
            } catch (error) {
                console.error('Falha ao salvar perfil:', error);
                showToast(error.message || 'Não foi possível salvar o perfil. Confira se as migrações do Supabase foram aplicadas.', 'info');
                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i>Salvar perfil';
            }
        }

        async function loadUserData() {
            const localActivities = loadLocalActivities();
            if (!state.authUser || !window.rideXSupabase) {
                state.userProfile = null;
                state.activities = localActivities;
                state.bicycles = [];
                state.activeActivity = localActivities.find(activity => activity.status === 'in_progress' || activity.status === 'paused') || null;
                state.gpsPoints = state.activeActivity?.points || [];
                state.pendingGpsPoints = [];
                state.gpsCurrentSpeedMps = 0;
                syncActivityButton();
                return;
            }
            const [activitiesResult, bicyclesResult, profileResult] = await Promise.all([
                window.rideXSupabase.from('activities').select('*').order('started_at', { ascending: false }),
                window.rideXSupabase.from('bicycles').select('*').order('created_at', { ascending: false }),
                window.rideXSupabase.from('profiles')
                    .select('user_id,full_name,handle,age,height_cm,weight_kg,bio')
                    .eq('user_id', state.authUser.id)
                    .maybeSingle()
            ]);
            if (activitiesResult.error) throw activitiesResult.error;
            if (bicyclesResult.error) throw bicyclesResult.error;
            if (profileResult.error) throw profileResult.error;
            state.userProfile = profileResult.data;
            state.activities = [...localActivities, ...activitiesResult.data];
            state.bicycles = bicyclesResult.data;
            state.activeActivity = localActivities.find(activity => activity.status === 'in_progress' || activity.status === 'paused')
                || activitiesResult.data.find(activity => activity.tracking_mode === 'gps'
                && (activity.status === 'in_progress' || activity.status === 'paused')) || null;
            state.gpsPoints = state.activeActivity?.local_only
                ? state.activeActivity.points || []
                : state.activeActivity?.tracking_mode === 'gps'
                ? await fetchActivityPoints(state.activeActivity.id)
                : [];
            state.pendingGpsPoints = state.activeActivity?.tracking_mode === 'gps' && !state.activeActivity.local_only
                ? loadPendingGpsPoints(state.activeActivity.id)
                : [];
            state.gpsCurrentSpeedMps = 0;
            updateAuthInterface();
            syncActivityButton();
        }

        const LOCAL_ACTIVITIES_STORAGE_KEY = 'ride-x-local-activities';

        function loadLocalActivities() {
            try {
                const stored = JSON.parse(localStorage.getItem(LOCAL_ACTIVITIES_STORAGE_KEY) || '[]');
                if (!Array.isArray(stored)) throw new Error('O conteúdo salvo não é uma lista de atividades.');
                return stored.filter(activity => activity && activity.local_only === true);
            } catch (error) {
                console.error('Falha ao recuperar pedaladas salvas neste dispositivo:', error);
                throw new Error('Não foi possível ler as pedaladas salvas neste navegador.');
            }
        }

        function persistLocalActivity() {
            if (!state.activeActivity?.local_only) return;
            const savedActivity = {
                ...state.activeActivity,
                points: state.gpsPoints.map(point => ({ ...point }))
            };
            state.activeActivity = savedActivity;
            state.activities = [savedActivity, ...state.activities.filter(activity => activity.id !== savedActivity.id)];
            try {
                localStorage.setItem(LOCAL_ACTIVITIES_STORAGE_KEY, JSON.stringify(
                    state.activities.filter(activity => activity.local_only)
                ));
            } catch (error) {
                console.error('Falha ao salvar pedalada neste dispositivo:', error);
                throw new Error('O navegador não conseguiu salvar a pedalada localmente. Verifique o espaço disponível.');
            }
        }

        async function refreshUserData() {
            try {
                await loadUserData();
                if (state.currentView === 'dashboard' || state.currentView === 'equipment') renderContent();
                return true;
            } catch (error) {
                console.error('Falha ao carregar dados do usuário:', error);
                showToast(error.message || 'Não foi possível carregar os dados da sua conta.', 'info');
                return false;
            }
        }

        function renderEmptyState(title, description) {
            return `<div class="col-span-full rounded-2xl border border-dashed border-grafite-500 p-8 text-center"><i class="fa-solid fa-folder-open text-2xl text-slate-500"></i><p class="mt-3 font-semibold text-white">${escapeHTML(title)}</p><p class="mt-1 text-sm text-slate-400">${escapeHTML(description)}</p></div>`;
        }

        function renderActivityList() {
            if (!state.authUser && state.activities.length === 0) return renderEmptyState('Nenhuma pedalada salva neste dispositivo', 'Inicie uma pedalada para registrar o percurso. Sem login, os dados ficam salvos somente neste navegador.');
            if (state.activities.length === 0) return renderEmptyState('Nenhuma atividade registrada', 'Inicie uma atividade pelo botão flutuante ou registre uma atividade manualmente.');
            return `<div class="space-y-3">${state.activities.map(activity => `
                <article class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 rounded-xl bg-grafite-900/60 p-4 border border-grafite-600">
                    <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                            <h4 class="font-semibold text-white">${escapeHTML(activity.name)}</h4>
                            <span class="rounded-full px-2 py-0.5 text-[10px] font-bold ${activity.status === 'in_progress' ? 'bg-lime/10 text-lime' : 'bg-grafite-700 text-slate-300'}">${activity.status === 'in_progress' ? 'Em andamento' : activity.status === 'paused' ? 'Pausada' : 'Concluída'}</span>
                            ${activity.local_only ? '<span class="rounded-full px-2 py-0.5 text-[10px] font-bold bg-sky-500/10 text-sky-300">Salva neste dispositivo</span>' : ''}
                        </div>
                        <p class="mt-1 text-xs text-slate-400">${new Date(activity.started_at).toLocaleString('pt-BR')} · ${Number(activity.distance_km).toLocaleString('pt-BR')} km · ${Number(activity.elevation_m).toLocaleString('pt-BR')} m</p>
                        ${activity.notes ? `<p class="mt-1 text-sm text-slate-300">${escapeHTML(activity.notes)}</p>` : ''}
                    </div>
                    <div class="flex gap-2 shrink-0">
                        ${activity.tracking_mode !== 'manual' ? `<button onclick="showActivityTrack('${activity.id}')" class="px-3 py-2 rounded-lg bg-grafite-700 hover:bg-grafite-600 text-lime text-xs font-semibold"><i class="fa-solid fa-map mr-1"></i>Mapa</button>` : ''}
                        ${activity.local_only ? '' : `<button onclick="openActivityModal('${activity.id}')" class="px-3 py-2 rounded-lg bg-grafite-700 hover:bg-grafite-600 text-white text-xs font-semibold">Editar</button>
                        <button onclick="deleteActivity('${activity.id}')" class="px-3 py-2 rounded-lg bg-red-950/50 hover:bg-red-900/70 text-red-300 text-xs font-semibold" aria-label="Excluir atividade"><i class="fa-solid fa-trash"></i></button>`}
                    </div>
                </article>
            `).join('')}</div>`;
        }

        function syncActivityButton() {
            const button = document.getElementById('activity-toggle');
            if (!button) return;
            const active = Boolean(state.activeActivity);
            const label = !active ? 'Iniciar pedal' : state.activeActivity.status === 'paused' || state.gpsWatchId === null ? 'Retomar pedal' : 'Ver pedalada';
            button.innerHTML = `<i class="fa-solid ${active ? 'fa-location-arrow' : 'fa-play'}"></i><span>${label}</span>`;
            button.setAttribute('aria-label', label);
            button.classList.toggle('bg-lime', !active);
            button.classList.toggle('hover:bg-lime-hover', !active);
            button.classList.toggle('bg-sky-300', active);
            button.classList.toggle('hover:bg-sky-200', active);
            button.classList.toggle('text-grafite-900', true);
        }

        function toDateTimeLocal(value) {
            if (!value) return '';
            const date = new Date(value);
            return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        }

        function openActivityModal(activityId = null, name = '') {
            if (!requireAuthenticatedUser()) return;
            const activity = state.activities.find(item => item.id === activityId);
            editingActivityId = activity?.id || null;
            const selectedName = activity?.name || name;
            const isRecordedTrack = activity && activity.tracking_mode !== 'manual';
            openModal(activity ? 'Editar atividade' : 'Registrar atividade', `
                <div class="space-y-4">
                    <div><label for="activity-name" class="text-xs text-slate-400 font-medium">Nome da atividade</label><input id="activity-name" maxlength="120" value="${escapeHTML(selectedName)}" required class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>
                    ${isRecordedTrack ? `<p class="text-xs text-slate-400">Distância, horário e elevação são derivados do percurso registrado e não podem ser editados manualmente. <button onclick="showActivityTrack('${activity.id}')" class="text-lime hover:underline">Ver mapa</button></p>` : `<div class="grid grid-cols-2 gap-4">
                        <div><label for="activity-distance" class="text-xs text-slate-400 font-medium">Distância (km)</label><input id="activity-distance" type="number" min="0" max="2000" step="0.01" value="${activity?.distance_km ?? 0}" required class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>
                        <div><label for="activity-elevation" class="text-xs text-slate-400 font-medium">Elevação (m)</label><input id="activity-elevation" type="number" min="0" max="30000" step="1" value="${activity?.elevation_m ?? 0}" required class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>
                    </div>
                    <div><label for="activity-started" class="text-xs text-slate-400 font-medium">Início</label><input id="activity-started" type="datetime-local" value="${toDateTimeLocal(activity?.started_at || new Date().toISOString())}" required class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>

                    <div id="activity-end-field"><label for="activity-ended" class="text-xs text-slate-400 font-medium">Término</label><input id="activity-ended" type="datetime-local" value="${toDateTimeLocal(activity?.ended_at || new Date().toISOString())}" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>`}
                    <div><label for="activity-notes" class="text-xs text-slate-400 font-medium">Observações</label><textarea id="activity-notes" maxlength="2000" rows="2" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 p-3 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime">${escapeHTML(activity?.notes || '')}</textarea></div>
                </div>
            `);
            if (!isRecordedTrack) toggleActivityEndField();
            setModalAction(activity ? 'Salvar alterações' : 'Registrar atividade', saveActivity);
        }

        function toggleActivityEndField() {
            const status = document.getElementById('activity-status');
            const endField = document.getElementById('activity-end-field');
            if (status && endField) endField.classList.toggle('hidden', status.value === 'in_progress');
        }

        async function saveActivity() {
            const name = document.getElementById('activity-name').value.trim();
            const existingActivity = state.activities.find(item => item.id === editingActivityId);
            const notes = document.getElementById('activity-notes').value.trim();
            if (existingActivity?.tracking_mode !== 'manual' && existingActivity) {
                if (!name || name.length > 120 || notes.length > 2000) {
                    showToast('Informe um nome de até 120 caracteres e observações de até 2.000 caracteres.', 'info');
                    return;
                }
                try {
                    const { data, error } = await window.rideXSupabase.from('activities')
                        .update({ name, notes }).eq('id', editingActivityId).select('id').maybeSingle();
                    if (error) throw error;
                    if (!data) throw new Error('Atividade não encontrada ou operação não autorizada.');
                    closeModal();
                    if (!await refreshUserData()) return;
                    showToast('Atividade atualizada.', 'success');
                    editingActivityId = null;
                } catch (error) {
                    console.error('Falha ao atualizar atividade:', error);
                    showToast(error.message || 'Não foi possível atualizar a atividade.', 'info');
                }
                return;
            }
            const startedAt = new Date(document.getElementById('activity-started').value);
            const status = document.getElementById('activity-status').value;
            const endedValue = document.getElementById('activity-ended').value;
            const endedAt = status === 'completed' ? new Date(endedValue) : null;
            const distanceValue = document.getElementById('activity-distance').value;
            const elevationValue = document.getElementById('activity-elevation').value;
            const distance = Number(distanceValue);
            const elevation = Number(elevationValue);
            if (!name || name.length > 120 || !Number.isFinite(startedAt.getTime())
                || !distanceValue || !Number.isFinite(distance) || distance < 0 || distance > 2000
                || !elevationValue || !Number.isInteger(elevation) || elevation < 0 || elevation > 30000
                || (status === 'completed' && (!endedValue || !Number.isFinite(endedAt.getTime()) || endedAt < startedAt))) {
                showToast('Confira nome, horários, distância e elevação. Os limites são 2.000 km e 30.000 m.', 'info');
                return;
            }
            const payload = {
                name,
                activity_type: 'cycling',
                status,
                started_at: startedAt.toISOString(),
                ended_at: endedAt ? endedAt.toISOString() : null,
                distance_km: distance,
                elevation_m: elevation,
                notes
            };
            try {
                const query = editingActivityId
                    ? window.rideXSupabase.from('activities').update(payload).eq('id', editingActivityId)
                    : window.rideXSupabase.from('activities').insert(payload);
                const { data, error } = await query.select('id').maybeSingle();
                if (error) throw error;
                if (!data) throw new Error('Atividade não encontrada ou operação não autorizada.');
                closeModal();
                if (!await refreshUserData()) return;
                showToast(editingActivityId ? 'Atividade atualizada.' : 'Atividade registrada.', 'success');
                editingActivityId = null;
            } catch (error) {
                console.error('Falha ao salvar atividade:', error);
                showToast(error.message || 'Não foi possível salvar a atividade.', 'info');
            }
        }

        async function deleteActivity(activityId) {
            if (!requireAuthenticatedUser()) return;
            if (state.activeActivity?.id === activityId) {
                showToast('Finalize a pedalada antes de excluí-la.', 'info');
                return;
            }
            if (!window.confirm('Excluir esta atividade?')) return;
            try {
                const { data, error } = await window.rideXSupabase.from('activities').delete().eq('id', activityId).select('id').maybeSingle();
                if (error) throw error;
                if (!data) throw new Error('Atividade não encontrada ou operação não autorizada.');
                if (!await refreshUserData()) return;
                showToast('Atividade excluída.', 'success');
            } catch (error) {
                console.error('Falha ao excluir atividade:', error);
                showToast(error.message || 'Não foi possível excluir a atividade.', 'info');
            }
        }

                        <div><label for="bicycle-model" class="text-xs text-slate-400 font-medium">Modelo</label><input id="bicycle-model" maxlength="120" value="${escapeHTML(bicycle?.model || '')}" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>

                        <div><label for="bicycle-year" class="text-xs text-slate-400 font-medium">Ano do modelo</label><input id="bicycle-year" type="number" min="1885" max="2100" value="${bicycle?.model_year ?? ''}" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime"></div>

                    <div><label for="bicycle-notes" class="text-xs text-slate-400 font-medium">Observações</label><textarea id="bicycle-notes" maxlength="2000" rows="2" class="w-full mt-1 bg-grafite-700 text-sm text-slate-200 p-3 rounded-xl border border-grafite-600 focus:outline-none focus:border-lime">${escapeHTML(bicycle?.notes || '')}</textarea></div>
                </div>
            `);
            setModalAction(bicycle ? 'Salvar alterações' : 'Cadastrar bicicleta', saveBicycle);
